<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Subtext</title>
    <meta name="description" content="Explore books, authors and influence as a map of what sits next to what." />
    <meta name="theme-color" content="#100E15" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23100E15'/%3E%3Cpath d='M9 8.5h11a1 1 0 0 1 1 1V23H11a2 2 0 0 1-2-2z' fill='none' stroke='%23C9A6FF' stroke-width='2.4'/%3E%3Cpath d='M9 20h12' stroke='%23F1ECE4' stroke-width='2.4'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map" class="map-wrap"></div>

    <section id="empty" class="empty" hidden>
      <div class="empty-inner">
        <div class="empty-copy">
          <h1>Every book sits next to other books.</h1>
          <p>
            Subtext draws the shelf around one: what Open Library files beside it, who else writes about the same
            things, and — where Wikidata knows — who read whom.
          </p>
          <div class="examples">
            <button type="button" class="example" data-example="book|Watchmen|Alan Moore">
              <span class="example-kind">Book</span>Watchmen
            </button>
            <button type="button" class="example" data-example="author|Ursula K. Le Guin">
              <span class="example-kind">Author</span>Ursula K. Le Guin
            </button>
            <button type="button" class="example" data-example="subject|graphic novels,autobiography">
              <span class="example-kind">Subject</span>Graphic novels and autobiography
            </button>
            <button type="button" class="example" data-example="influence|Alan Moore">
              <span class="example-kind">Influence</span>Who shaped Alan Moore
            </button>
          </div>
        </div>
        <svg id="empty-art" class="empty-art" aria-hidden="true"></svg>
      </div>
    </section>

    <header class="topbar">
      <div class="brand-row">
        <span class="wordmark"><span class="spectrum-dot" aria-hidden="true"></span>subtext</span>
        <button id="about-button" class="icon-button" type="button" aria-label="Where this data comes from"></button>
      </div>
      <div id="search" class="search" role="search"></div>
      <nav id="crumb" class="crumb" aria-label="Current map" hidden>
        <button id="back" class="icon-button" type="button" aria-label="Go back"></button>
        <span id="map-title"></span>
      </nav>
    </header>

    <aside id="panel" class="panel" aria-label="Details" hidden></aside>

    <div id="controls" class="map-controls" hidden>
      <div class="zoom">
        <button id="zoom-in" class="icon-button" type="button" aria-label="Zoom in"></button>
        <button id="zoom-out" class="icon-button" type="button" aria-label="Zoom out"></button>
        <button id="zoom-fit" class="icon-button" type="button" aria-label="Fit the map to the screen"></button>
      </div>
      <p class="legend"><span class="spectrum-dot" aria-hidden="true"></span><span id="legend-text">Closer colours, closer subjects</span></p>
    </div>

    <div id="status" class="status" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
